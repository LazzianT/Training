server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    # Keep the /api prefix. Without this trailing slash, /api/auth/login
    # reaches Express unchanged instead of becoming /auth/login.
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    # $http_host, not $host. $host is the hostname alone and drops the port, so a
    # deployment on :3006 forwarded "10.103.90.5" and the API built QR links
    # pointing at port 80, where nothing is listening. $http_host is the header as
    # the browser sent it, port and all.
    proxy_set_header Host $http_host;
    # The API builds absolute links from the request and honours this, so a TLS
    # terminator in front of nginx does not produce http links for an https site.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $http_x_request_id;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
