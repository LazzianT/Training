services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-1433}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-BMC}
      DB_ENCRYPT: ${DB_ENCRYPT:-false}
      DB_TRUST_SERVER_CERTIFICATE: ${DB_TRUST_SERVER_CERTIFICATE:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3006}
      # Fail at deploy time, not at container start. Without the ":?" guard an
      # unset variable is substituted with an empty string, which reaches the
      # app as "" rather than undefined, so the Zod default never applies and
      # the process dies with a stack trace instead of a usable message.
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in the stack environment, minimum 32 characters}"
      REFRESH_TOKEN_PEPPER: "${REFRESH_TOKEN_PEPPER:?set REFRESH_TOKEN_PEPPER in the stack environment, minimum 32 characters}"
      UPLOAD_ROOT: /app/data/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-}
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:-}
    ports:
      - "3007:3000"
    volumes:
      - upload_data:/app/data/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      # While start_period is running a failure does not count, so a slow first
      # connection to SQL Server cannot mark the api unhealthy before it is up.
      start_period: 20s

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    depends_on:
      api:
        # nginx resolves "api" at startup and exits with [emerg] if the name
        # does not exist yet, so wait for the api to actually be healthy
        # rather than merely started. The healthcheck covers the DB round trip.
        condition: service_healthy
    ports:
      - "3006:80"

volumes:
  upload_data:
